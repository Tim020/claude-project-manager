name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run; runs on main always
# finish, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee test.log
      - name: Annotate failures
        if: failure()
        shell: bash
        run: ./scripts/annotate-failures.sh test.log

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Toolchain
        run: swift --version
      - name: Test
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee test.log
      - name: Build app bundle
        run: |
          set -o pipefail
          ./scripts/build-app.sh 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        run: ./scripts/annotate-failures.sh test.log build.log
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Claudio-app
          path: build/Claudio.zip
          if-no-files-found: error
