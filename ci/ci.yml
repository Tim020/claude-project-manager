name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --parallel

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test --parallel
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SessionManager-app
          path: build/Session Manager.zip
          if-no-files-found: error
